name: Check shell script formatting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # shfmt release assets carry the version in their file name, so a
      # releases/latest/download URL breaks on every new release. Build the
      # latest version from source instead.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - run: just format-shell
